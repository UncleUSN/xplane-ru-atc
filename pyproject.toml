[project]
name = "xplane-ru-atc"
# Версия живёт только в ru_atc/__init__.py (__version__). Не дублируйте её здесь:
# строка «0.3.1-beta» не является версией PEP 440, а два источника разъедутся.
description = "Русскоязычный голосовой диспетчер (ATC) для X-Plane 12 / Zibo 737"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
