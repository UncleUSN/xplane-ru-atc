# =====================================================================================
#  ДАННЫЕ АЭРОДРОМОВ — ПРИМЕР (SAMPLE). НЕ ДЛЯ РЕАЛЬНОЙ НАВИГАЦИИ.
#  Частоты и позывные взяты из открытых источников для виртуальных сетей (ru.ivao.aero,
#  карточки аэропортов XR-DIV, просмотрено 21.11.2026) и старых публикаций AIP РФ (2013).
#  Они могут отличаться от действующего AIP РФ — сверяйте с AIP / актуальными картами
#  (Navigraph/Jeppesen/caica.ru) и правьте под себя. Формат: YAML, кодировка UTF-8.
#
#  Поля:
#    units.<тип>: delivery / ground / tower / radar (Круг) / approach (Подход)
#      callsign — позывной для радиообмена, freq — МГц, voice — голос Silero (необязательно)
#    runways: [{id, hdg (магнитный курс), ils (МГц, необязательно)}]
#    transition_altitude_ft, transition_levels: [{qnh_min: гПа, fl: эшелон}] — сверху вниз
#    squawk_range: [начало, конец] (восьмеричные коды)
#    initial_climb: {alt_ft: ...} либо {fl: ...}
#    stands: список стоянок по умолчанию (для подсказки), sid: подсказки SID по ВПП
# =====================================================================================

moscow_tl: &moscow_tl          # Московская зона: ВП 10000 ft, ЭП зависит от QNH (ops.group, AIC 08/19)
  - {qnh_min: 1012, fl: 110}     # XR-DIV указывает порог 1013 гПа — уточните по AIP
  - {qnh_min: 977, fl: 120}
  - {qnh_min: 0, fl: 130}

airports:
  UUEE:
    name: Шереметьево
    name_gen: Шереметьево          # "разрешено до ..." (родительный падеж)
    lat: 55.9728
    lon: 37.4146
    elevation_ft: 630
    # Образец. Когда собран кэш X-Plane, частоту заменяет ряд 1050 apt.dat.
    atis_freq: 126.600
    transition_altitude_ft: 10000
    transition_levels: *moscow_tl
    squawk_range: ["1501", "1537"]
    initial_climb: {alt_ft: 6000}   # ПРИМЕР — смотрите вашу схему SID
    approach_radius_km: 70
    radar_radius_km: 40
    runways:
      - {id: 06R, hdg: 64, ils: 109.1}
      - {id: 24L, hdg: 244, ils: 110.5}
      - {id: 06C, hdg: 64, ils: 108.1}
      - {id: 24C, hdg: 244, ils: 111.3}
      - {id: 06L, hdg: 64, ils: 108.75}
      - {id: 24R, hdg: 244, ils: 109.35}
    preferred_departure: ["24C", "06C"]
    preferred_arrival: ["24L", "06R"]
    units:
      delivery: {callsign: Шереметьево-Деливери, freq: 120.875}
      ground:   {callsign: Шереметьево-Руление, freq: 121.8}
      tower:    {callsign: Шереметьево-Старт, freq: 131.5}
